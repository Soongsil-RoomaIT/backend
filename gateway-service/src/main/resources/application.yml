server:
  port: 8080
spring:
  application:
    name: gateway-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8180/realms/room-care}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8180/realms/room-care/protocol/openid-connect/certs}
  cloud:
    gateway:
      default-filters:
        - RemoveRequestHeader=Cookie
      routes:
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/notifications/**
        - id: cloud-service
          uri: ${CLOUD_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/devices/**,/api/sensors/**,/api/automation/**
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
  endpoint:
    health:
      probes:
        enabled: true
logging:
  pattern:
    console: '{"time":"%d{yyyy-MM-dd''T''HH:mm:ss.SSSXXX}","level":"%p","service":"gateway-service","trace":"%X{traceId:-}","message":"%replace(%m){''"'',''\"''}"}%n'

