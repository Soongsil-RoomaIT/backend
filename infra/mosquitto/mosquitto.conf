# MQTT 브로커 (SAD v1.2 ADR-016). 익명 접속 금지, 계정·ACL 적용.
persistence true
persistence_location /mosquitto/data/
log_dest stdout
per_listener_settings false
allow_anonymous false
# 비밀번호 파일은 컨테이너 시작 시 .env의 값으로 만듭니다(compose.yaml mosquitto command).
password_file /mosquitto/data/passwd
# ACL은 infra/mosquitto/acl을 시작 시 data로 복사해 mosquitto 소유로 둡니다.
acl_file /mosquitto/data/acl

# Compose 내부망 전용 평문 포트(cloud-server용). 호스트에 공개하지 않습니다.
listener 1883

# 라즈베리파이용 TLS 포트. 인증서는 infra/mosquitto/gen-certs.sh로 secrets/mosquitto에 만듭니다.
listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2
