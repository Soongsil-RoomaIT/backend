# 외부 공개 진입점(80). 웹 정적 파일을 제공하고 /api·/ws만 Gateway로 중계합니다.
# /internal(Cloud Server → Gateway 알림)과 /actuator(지표·헬스)는 외부에 노출하지 않습니다.
events {}
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location ^~ /internal {
      return 404;
    }
    location ^~ /actuator {
      return 404;
    }
    location = /ws {
      proxy_pass http://gateway-service:8080;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      # Gateway가 같은 출처(Origin 호스트 = Host)인지 확인할 수 있도록 포트까지 그대로 전달합니다.
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 60s;
    }
    location ^~ /api/ {
      limit_req zone=api_limit burst=40 nodelay;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://gateway-service:8080;
    }
    # React 라우터 경로는 index.html로 돌려 새로고침해도 화면이 열리게 합니다.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
