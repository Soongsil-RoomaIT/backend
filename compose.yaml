# 자취방 원격 케어 시스템 클라우드 VM 구성 (SAD v1.2 ADR-016, 7.1)
# 외부 공개 포트는 nginx 80(웹·API)과 Mosquitto 8883(MQTT TLS)뿐입니다.
# Gateway·Cloud Server·PostgreSQL·Redis는 Compose 내부망에만 있고, Prometheus는 127.0.0.1에만 엽니다.
# backend, cloud-server, frontend 저장소를 같은 폴더에 나란히 둡니다(경로는 .env로 바꿀 수 있음).
#
# 모든 컨테이너 로그는 json-file 드라이버로 10MB x 3개까지만 보관합니다(디스크 보호).
# 장기 로그 조회·보존은 observability 프로필의 Loki(7일)를 사용합니다.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    logging: *default-logging
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # frontend 저장소에서 npm run build로 만든 정적 파일
      - ${WEB_DIST_DIR:-../frontend/dist}:/usr/share/nginx/html:ro
    depends_on:
      gateway-service:
        condition: service_healthy

  gateway-service:
    logging: *default-logging
    build: ./node-service
    environment:
      NODE_ENV: production
      # Vite 개발 서버 등 다른 출처만 적습니다. nginx가 제공하는 같은 출처는 자동 허용됩니다.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      TRUST_PROXY: uniquelocal
      REDIS_URL: redis://redis:6379
      DATA_ENCRYPTION_KEY_BASE64: ${DATA_ENCRYPTION_KEY_BASE64:?DATA_ENCRYPTION_KEY_BASE64 is required (run node node-service/scripts/setup-env.js)}
      # 로그인 기능이 없으므로 웹의 모든 요청은 이 한 명의 방 사용자로 처리됩니다.
      ROOM_USER_ID: ${ROOM_USER_ID:-room-user}
      # Cloud Server가 POST /internal/notifications에 X-Internal-Key로 보내는 공유 비밀값
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required (run node node-service/scripts/setup-env.js)}
      CLOUD_SERVICE_URL: http://cloud-server:3000
      CLOUD_HEALTH_PATH: /health
      FCM_ENABLED: ${FCM_ENABLED:-false}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account.json
    volumes:
      - ./secrets:/run/secrets:ro
    # 생존(liveness)만 검사합니다. C 서버 장애로 Gateway 컨테이너가 재시작되지 않도록 readiness는 경보로만 다룹니다.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/actuator/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
    depends_on:
      redis:
        condition: service_healthy

  cloud-server:
    logging: *default-logging
    # C 담당 cloud-server 저장소를 그대로 빌드합니다(저장소에 Dockerfile이 없어 여기서 정의).
    build:
      context: ${CLOUD_SERVER_DIR:-../cloud-server}
      dockerfile_inline: |
        FROM node:22-alpine
        WORKDIR /app
        COPY package*.json ./
        RUN npm ci --omit=dev --ignore-scripts
        COPY src ./src
        COPY database ./database
        COPY public ./public
        USER node
        EXPOSE 3000
        CMD ["node", "src/server.js"]
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      DEMO_MODE: "false"
      DATABASE_URL: postgresql://roomait:${POSTGRES_PASSWORD}@postgres:5432/roomait
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_USERNAME: cloud-server
      MQTT_PASSWORD: ${MQTT_CLOUD_PASSWORD:?MQTT_CLOUD_PASSWORD is required (run node node-service/scripts/setup-env.js)}
      MQTT_TOPIC_PREFIX: roomcare/${EDGE_DEVICE_ID:-room-001}
      MQTT_PROTOCOL: ${MQTT_PROTOCOL:-roomait-v1}
      CORS_ORIGINS: http://gateway-service:8080
      KMA_SERVICE_KEY: ${KMA_SERVICE_KEY:-}
      # Gateway 내부 알림 API(SAD 10.3). C 서버가 X-Internal-Key 방식을 지원하면 사용합니다.
      GATEWAY_INTERNAL_NOTIFICATIONS_URL: http://gateway-service:8080/internal/notifications
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started

  postgres:
    logging: *default-logging
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: roomait
      POSTGRES_USER: roomait
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - cloud-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roomait -d roomait"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    logging: *default-logging
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mosquitto:
    logging: *default-logging
    image: eclipse-mosquitto:2.0.20
    environment:
      EDGE_DEVICE_ID: ${EDGE_DEVICE_ID:-room-001}
      MQTT_EDGE_PASSWORD: ${MQTT_EDGE_PASSWORD:?MQTT_EDGE_PASSWORD is required (run node node-service/scripts/setup-env.js)}
      MQTT_CLOUD_PASSWORD: ${MQTT_CLOUD_PASSWORD}
    # 엣지 계정의 사용자명은 deviceId입니다(ACL: roomcare/{deviceId}/#). 비밀번호 파일은 시작할 때마다 다시 만듭니다.
    command:
      - sh
      - -c
      - >-
        mosquitto_passwd -c -b /mosquitto/data/passwd "$$EDGE_DEVICE_ID" "$$MQTT_EDGE_PASSWORD" &&
        mosquitto_passwd -b /mosquitto/data/passwd cloud-server "$$MQTT_CLOUD_PASSWORD" &&
        cp /mosquitto/config/acl /mosquitto/data/acl &&
        chown mosquitto:mosquitto /mosquitto/data/passwd /mosquitto/data/acl &&
        chmod 0700 /mosquitto/data/passwd /mosquitto/data/acl &&
        exec mosquitto -c /mosquitto/config/mosquitto.conf
    ports:
      - "8883:8883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infra/mosquitto/acl:/mosquitto/config/acl:ro
      # infra/mosquitto/gen-certs.sh로 만든 CA·서버 인증서
      - ./secrets/mosquitto:/mosquitto/certs:ro
      - mosquitto-data:/mosquitto/data

  prometheus:
    logging: *default-logging
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - gateway-service

  # ---- alerting 프로필(선택): docker compose --profile alerting up ----
  # SAD v1.2는 경보를 Prometheus 화면에서 확인합니다. 팀 채널 통지가 필요할 때만 켭니다.
  alertmanager:
    logging: *default-logging
    image: prom/alertmanager:v0.27.0
    profiles: ["alerting"]
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --data.retention=120h
    volumes:
      - ./infra/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      # slack-webhook-url 파일 하나만 둡니다. 다른 비밀(Firebase 등)은 노출하지 않습니다.
      - ./secrets/alertmanager:/etc/alertmanager/secrets:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"

  # ---- observability 프로필(선택): docker compose --profile observability up ----
  loki:
    image: grafana/loki:3.2.1
    profiles: ["observability"]
    logging: *default-logging
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./infra/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"

  alloy:
    image: grafana/alloy:v1.5.1
    profiles: ["observability"]
    logging: *default-logging
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - ./infra/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # 컨테이너 로그 수집용. 읽기 전용이어도 Docker API 전체 권한이므로 운영에서는 노드 에이전트로 대체합니다.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.3.1
    profiles: ["observability"]
    logging: *default-logging
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required for the observability profile}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - loki

volumes:
  cloud-db:
  redis-data:
  mosquitto-data:
  prometheus-data:
  alertmanager-data:
  loki-data:
  alloy-data:
  grafana-data:
