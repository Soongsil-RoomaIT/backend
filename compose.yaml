services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8180
    ports:
      - "8180:8080"
    volumes:
      - ./infra/keycloak/room-care-realm.json:/opt/keycloak/data/import/room-care-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  notification-service:
    profiles: ["legacy-java"]
    build: ./notification-service
    environment:
      REDIS_HOST: redis
      JWT_ISSUER_URI: http://localhost:8180/realms/room-care
      JWT_JWK_SET_URI: http://keycloak:8080/realms/room-care/protocol/openid-connect/certs
      DATA_ENCRYPTION_KEY_BASE64: ${DATA_ENCRYPTION_KEY_BASE64}
      FIREBASE_CREDENTIALS_PATH: ${FIREBASE_CREDENTIALS_PATH:-}
    ports:
      - "8082:8082"
    volumes:
      - ./secrets:/run/secrets:ro
    depends_on:
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started

  gateway-service:
    build: ./node-service
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DEV_AUTH_BYPASS: ${DEV_AUTH_BYPASS:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      REDIS_URL: redis://redis:6379
      DATA_ENCRYPTION_KEY_BASE64: ${DATA_ENCRYPTION_KEY_BASE64}
      JWT_AUDIENCE: room-care-api
      JWT_ISSUER_URI: http://localhost:8180/realms/room-care
      JWT_JWK_SET_URI: http://keycloak:8080/realms/room-care/protocol/openid-connect/certs
      CLOUD_SERVICE_URL: ${CLOUD_SERVICE_URL:-http://host.docker.internal:8081}
      FCM_ENABLED: ${FCM_ENABLED:-false}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account.json
    volumes:
      - ./secrets:/run/secrets:ro
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started

  prometheus:
    image: prom/prometheus:v2.55.1
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - gateway-service
      - notification-service

  tls-proxy:
    image: nginx:1.27-alpine
    profiles: ["tls"]
    ports:
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - gateway-service

volumes:
  postgres-data:
  redis-data:

